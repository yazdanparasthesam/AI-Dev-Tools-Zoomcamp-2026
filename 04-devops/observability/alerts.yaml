# Q4 — provisioned Grafana alert rule: 5xx on the order-lookup endpoint.
# Quiet periods (no 5xx series at all) resolve via noDataState: OK, so the
# rule sits at Normal instead of "No data"; a real 5xx burst goes
# Pending (for: 1m) -> Firing and notifies the responder webhook (Q6).
apiVersion: 1

groups:
  - orgId: 1
    folder: Order Tracker Alerts
    name: order-tracker-5xx
    interval: 30s
    rules:
      - uid: order-5xx-rate
        title: Order Tracker 5xx errors on order lookups
        condition: C
        noDataState: OK      # <- "handle periods with no 5xx"
        execErrState: OK
        for: 1m
        data:
          - refId: A
            relativeTimeRange:
              from: 300      # 5-minute window
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
              expr: sum(rate(http_server_requests_total{http_status_code=~"5.."}[5m]))
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: ["B"]
                  reducer:
                    type: last
                    params: []
                  type: query
        annotations:
          summary: "5xx responses on Order Tracker order lookups"
          description: >-
            Rate of HTTP 5xx on endpoint GET /api/orders/{order_id} exceeded 0
            over a 5m window (evaluated every 30s, pending 1m). Periods with no
            5xx series at all stay Normal (noDataState=OK).
          endpoint: "GET /api/orders/{order_id}"
          window: "5m"
          dashboard_url: "http://localhost:3000/d/order-tracker?orgId=1"
        labels:
          severity: critical
          scope: order-tracker
