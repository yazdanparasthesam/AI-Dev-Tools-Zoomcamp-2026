# OpenTelemetry Collector — one OTLP/HTTP inlet, three storages out.
# metrics -> Prometheus (scraped from the collector's own :8889)
# logs    -> Loki   (labels promoted via loki.* hints set in transform)
# traces  -> Tempo  (OTLP/gRPC)
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  transform/loki-hints:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["loki.resource.labels"], "service.name")
      - context: log
        statements:
          - set(attributes["loki.attribute.labels"], "order_id,http_status")

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [transform/loki-hints, batch]
      exporters: [loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
