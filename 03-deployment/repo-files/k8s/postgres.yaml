# PostgreSQL with persistent storage + readiness checks (Step 5, Q5).
# Service name `postgres` = in-cluster DNS name, same idea as compose Q4.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16          # already local from the compose step
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: relay-db, key: user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: relay-db, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: relay-db, key: db}}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "relay", "-d", "relay"]
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "relay", "-d", "relay"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
