# DB credentials for both deployments. stringData = plaintext in the file,
# base64-at-rest in etcd; fine for a local kind homework cluster, and the
# shape a sealed-secret/SOPS story would replace in production.
apiVersion: v1
kind: Secret
metadata:
  name: relay-db
type: Opaque
stringData:
  url: postgresql+psycopg://relay:relay@postgres:5432/relay
  user: relay
  password: relay
  db: relay
